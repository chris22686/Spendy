name: Build & Release Apps

# One pipeline for both platforms: every push to main builds Android + iOS
# with the same auto-incremented version and publishes a GitHub release.
# - Android: install updates via Obtainium (tracks GitHub releases) or the APK link
# - iOS: Feather/AltStore source (repo.json) gets the new version -> "Update" button

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'repo.json'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apps
  cancel-in-progress: false

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        run: |
          echo "version=1.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${{ github.run_number }} + 10 ))" >> "$GITHUB_OUTPUT"

  android:
    name: Build Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PversionCode=${{ needs.version.outputs.code }} \
            -PversionName=${{ needs.version.outputs.version }}
          cp app/build/outputs/apk/debug/app-debug.apk ../Spendy.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spendy-Android
          path: Spendy.apk
          retention-days: 14

  ios:
    name: Build iOS IPA
    needs: version
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode Archive (Unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            MARKETING_VERSION=${{ needs.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ needs.version.outputs.code }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r Spendy.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spendy-iOS
          path: build/Spendy.ipa
          retention-days: 14

  publish:
    name: Publish release
    needs: [version, android, ios]
    # Publish whatever built successfully, so one platform failing doesn't block the other
    if: ${{ always() && needs.version.result == 'success' && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT_MSG: ${{ github.event.head_commit.message || 'Manual build' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Spendy-*
          merge-multiple: true
          path: out

      - name: Update Feather repo.json
        if: ${{ needs.ios.result == 'success' }}
        run: |
          export NOTES="$(printf '%s' "$COMMIT_MSG" | head -n1)"
          export IPA_SIZE=$(stat -c%s out/Spendy.ipa)
          export BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export IPA_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/Spendy.ipa"
          node -e '
            const fs = require("fs");
            const e = process.env;
            const repo = JSON.parse(fs.readFileSync("repo.json", "utf8"));
            const app = repo.apps[0];
            const size = Number(e.IPA_SIZE);
            const minOS = (app.versions && app.versions[0] && app.versions[0].minOSVersion) || "14.0";
            Object.assign(app, {
              version: e.VERSION,
              versionDate: e.BUILD_DATE,
              versionDescription: e.NOTES,
              downloadURL: e.IPA_URL,
              size,
            });
            const entry = {
              version: e.VERSION,
              date: e.BUILD_DATE,
              localizedDescription: e.NOTES,
              downloadURL: e.IPA_URL,
              size,
              minOSVersion: minOS,
            };
            app.versions = [entry, ...(app.versions || []).filter(v => v.version !== e.VERSION)].slice(0, 5);
            fs.writeFileSync("repo.json", JSON.stringify(repo, null, 2) + "\n");
          '
          cp repo.json out/repo.json

      - name: Create versioned GitHub release
        run: |
          printf '%s\n\n%s\n' "$COMMIT_MSG" "Android: install Spendy.apk (or track this repo in Obtainium). iOS: update from the Feather source." > notes.md
          gh release create "v${VERSION}" out/* \
            --target "${{ github.sha }}" \
            --title "Spendy ${VERSION}" \
            --notes-file notes.md \
            --latest

      - name: Refresh rolling "latest" download links
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest out/* --clobber
            gh release edit latest --prerelease
          else
            gh release create latest out/* --prerelease \
              --title "Spendy Latest Build (rolling)" \
              --notes "Always contains the newest APK/IPA. Versioned releases are listed separately."
          fi

      - name: Commit updated repo.json
        if: ${{ needs.ios.result == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          if ! git diff --staged --quiet; then
            git commit -m "Update Feather repo.json to ${VERSION} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Remove old versioned releases (keep 10)
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("v"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
          | while read -r tag; do
              gh release delete "$tag" --yes --cleanup-tag
            done
